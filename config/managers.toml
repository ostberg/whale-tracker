# - Evidence for every filer: docs/MANAGER_SURVEY.md (watchlist) and the CIK check of 2026-10-09 (writers).
# - Tags here are proposals only (W-038). They apply once ratified in core.tag_decision. A trailing "?" marks
#   a tag the agent was unsure of (docs/RATINGS_AND_TAGS.md, section 4).
# - Filer quarter ranges (W-024): first_quarter and last_quarter are quarter-end dates; leave one out for
#   "from the start" or "still filing".
# - excluded_filing lists filings that must not count (duplicates); it is stored from phase 3.
# - `active = false` keeps a manager on file without tracking it. Whether to track all of them is W-026.

