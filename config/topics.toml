# The controlled topic list (W-018). Loaded into core.topic by `whales config sync`.
# The model may tag only these; anything else waits in letters.topic_candidate for a person to approve.
# Source of truth is still an open owner decision (STATUS.md). This follows the recommended option (a):
# a short list owned here, each topic carrying `tamale_topic_id` once its Tamale twin is identified.
# Twins matched against the live Tamale list (259 Topic entities, read through the Tamale repo's client) on
# 2026-10-20: five found. Interest rates (Tamale has only "Rising Rates"), US Treasuries, inflation, European
# macro and oil have no Tamale topic; see STATUS.md, W-018.
# A parent must be defined above its children.

[[topic]]
slug = "interest-rates"
name = "Interest rates"
description = "Policy rates, the path of central-bank decisions, and the level and shape of the yield curve"
aliases = ["rates", "fed policy", "fed funds", "monetary policy", "yield curve"]

[[topic]]
slug = "us-treasuries"
name = "US Treasuries"
description = "US government bonds: yields, supply, term premium, demand and the deficit's effect on them"
aliases = ["treasuries", "10-year", "long bond", "term premium", "us debt"]

[[topic]]
slug = "inflation"
name = "Inflation"
description = "Consumer and producer prices, wages and inflation expectations"
aliases = ["cpi", "pce", "price level", "wage growth"]

[[topic]]
slug = "european-macro"
name = "European macro"
description = "Euro-area and UK growth, ECB and Bank of England policy, sovereign spreads, European politics"
aliases = ["europe", "eurozone", "ecb", "bank of england", "bund", "btp spreads", "oat spreads"]

[[topic]]
slug = "housing"
name = "Housing"
description = "Home prices, building, mortgage rates and the businesses that depend on them"
aliases = ["homebuilders", "mortgage rates", "residential construction", "home prices"]
tamale_topic_id = "8b633a8f706a4a3f87b2127d7be3e8b3"  # Tamale: Housing US

[[topic]]
slug = "lumber"
name = "Lumber"
description = "Lumber and timber prices, sawmills and timberland"
aliases = ["timber", "wood products", "timberland"]
tamale_topic_id = "8fa192864b504703bc608bab4ecfb88e"  # Tamale: Lumber (Wood Products is a separate Tamale topic)
parent = "housing"

[[topic]]
slug = "ai"
name = "Artificial intelligence"
description = "AI models, adoption, spending, and its effect on companies and markets"
aliases = ["artificial intelligence", "llm", "large language models", "genai", "ai capex", "ai bubble"]
# Tamale: Artificial Intelligence & Machine Learning, the umbrella. Tamale also has AI Capex, Generative AI,
# Large Language Models, AI Agents, AI-Networking and Industrial AI as separate topics.
tamale_topic_id = "cf85bb86fe9046afac0b660ea894db76"

[[topic]]
slug = "edge-compute"
name = "Edge compute"
description = "Computing near the user or device rather than in central data centres: devices, networks, chips"
aliases = ["edge computing", "on-device ai", "edge ai"]
tamale_topic_id = "77bfda8289404361b02e3d381be6258b"  # Tamale: Edge Computing
parent = "ai"

[[topic]]
slug = "gold"
name = "Gold"
description = "Gold and precious metals, miners and central-bank buying"
aliases = ["precious metals", "gold miners", "bullion", "silver"]
tamale_topic_id = "9725921b58144bccb19f0898df08820a"  # Tamale: Gold and Gold Equities (silver is its own topic)

[[topic]]
slug = "oil"
name = "Oil"
description = "Crude oil and products: supply, demand, OPEC, prices and energy equities"
aliases = ["crude", "opec", "energy", "brent", "wti"]
