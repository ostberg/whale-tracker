# The controlled topic list (W-018). Loaded into core.topic by `whales config sync`.
# The model may tag only these; anything else waits in letters.topic_candidate for a person to approve.
# Source of truth is still an open owner decision (STATUS.md). This follows the recommended option (a):
# a short list owned here, each topic carrying `tamale_topic_id` once its Tamale twin is identified.
# A parent must be defined above its children.

