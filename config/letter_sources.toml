# Evidence for each: docs/LETTER_SOURCES.md.
#
# EVERY SOURCE IS INACTIVE until compliance rules. To activate one, set approved_by, approved_at and
# active = true; the sync refuses an active source without an approval.
#
# The permission flags are the agent's reading of each site's terms on 2026-10-08, not legal advice:
#   access_restricted  bots banned, or a form, gate or bot wall  -> mode must be "manual" (a person downloads)
#   storage_allowed    false everywhere except SEC filings: most terms bar copying or reproduction (W-032)
#   use_allowed        false where terms ban AI, automated text analysis, text mining or data mining (W-035)
# Tier: 1 published by the manager, 2 an SEC filing, 3 a licensed republisher (none yet). Tier 4 never here.

